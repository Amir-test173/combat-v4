name: Build World Dominion Realism

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build world administrative dataset
        run: cd .. && python tool/fetch_world_data.py
      - run: npm install --no-audit --no-fund
      - run: npm run check

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Restore Gradle wrapper if repository was uploaded without binary wrapper
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create /tmp/wd_scaffold --platforms=android --project-name world_dominion --org com.worlddominion
            cp /tmp/wd_scaffold/android/gradlew android/gradlew
            cp /tmp/wd_scaffold/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/wd_scaffold/android/gradle/wrapper/* android/gradle/wrapper/
            chmod +x android/gradlew
          fi
      - name: Repair known Dart analyzer errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          original = s

          # The package barrel currently does not export SMapWorld.
          world_import = "import 'package:countries_world_map/data/maps/world_map.dart';"
          anchor_import = "import 'package:countries_world_map/countries_world_map.dart';"
          if world_import not in s:
              s = s.replace(anchor_import, anchor_import + "\n" + world_import, 1)

          fixes = {
              "aiDifficulty=='easy'?.86": "aiDifficulty=='easy'?0.86",
              "p=='cautious'?.90": "p=='cautious'?0.90",
              "p=='cautious'?.86": "p=='cautious'?0.86",
              "wonRound?.06": "wonRound?0.06",
              "wonRound?.13": "wonRound?0.13",
              "battle.encircled?.78": "battle.encircled?0.78",
              "profile==0?.45": "profile==0?0.45",
              "profile==2?.25": "profile==2?0.25",
              "final soldiers=6+min(32,(sqrt(pop)*1.2).round());": "final int soldiers=(6+min(32,(sqrt(pop)*1.2).round())).toInt();",
              "final tanks=max(1,min(5,((steel+money)/10).round()));": "final int tanks=max(1,min(5,((steel+money)/10).round())).toInt();",
              "final aircraft=max(1,min(4,((power+money)/12).round()));": "final int aircraft=max(1,min(4,((power+money)/12).round())).toInt();",
              "final navy=coastal.contains(id)?max(1,min(3,((fuel+money)/14).round())):0;": "final int navy=coastal.contains(id)?max(1,min(3,((fuel+money)/14).round())).toInt():0;",
              "name='المجمع الصناعي'": "name:'المجمع الصناعي'",
              "name='محطة الطاقة'": "name:'محطة الطاقة'",
              "name='مركز الإمداد'": "name:'مركز الإمداد'",
              "name='القاعدة الجوية'": "name:'القاعدة الجوية'",
              "name='الميناء الرئيسي'": "name:'الميناء الرئيسي'",
          }
          for old, new in fixes.items():
              if old in s:
                  s = s.replace(old, new)
                  print(f'Fixed: {old[:70]}')

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Applied Dart source repairs.')
          else:
              print('No Dart source repairs needed.')
          PY
      - name: Commit repaired Dart source
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if ! git diff --quiet -- lib/main.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/main.dart
            git commit -m "Fix remaining Dart analyzer errors"
            git push
          fi
      - name: Build world administrative dataset
        run: python tool/fetch_world_data.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build private-test APK
        env:
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: >-
          flutter build apk --release
          --dart-define=DEFAULT_SERVER_URL="$DEFAULT_SERVER_URL"
          --dart-define=PRIVACY_POLICY_URL="$PRIVACY_POLICY_URL"
          --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-dominion-1.4.0-realism-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
