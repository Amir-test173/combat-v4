name: Build signed Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Restore Gradle wrapper if needed
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create /tmp/wd_scaffold --platforms=android --project-name world_dominion --org com.worlddominion
            cp /tmp/wd_scaffold/android/gradlew android/gradlew
            cp /tmp/wd_scaffold/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/wd_scaffold/android/gradle/wrapper/* android/gradle/wrapper/
            chmod +x android/gradlew
          fi
      - name: Require Play signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          test -n "$ANDROID_STORE_PASSWORD" || (echo "Missing ANDROID_STORE_PASSWORD" && exit 1)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Require production configuration
        shell: bash
        env:
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          [[ "$DEFAULT_SERVER_URL" == wss://* ]] || (echo "DEFAULT_SERVER_URL must be a public wss:// URL" && exit 1)
          [[ "$PRIVACY_POLICY_URL" == https://* ]] || (echo "PRIVACY_POLICY_URL must be a public https:// URL" && exit 1)
          [[ "$SUPPORT_EMAIL" == *@*.* ]] || (echo "SUPPORT_EMAIL is missing or invalid" && exit 1)
      - name: Build world administrative dataset
        run: python tool/fetch_world_data.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test
      - name: Build signed AAB
        env:
          DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: >-
          flutter build appbundle --release
          --dart-define=DEFAULT_SERVER_URL="$DEFAULT_SERVER_URL"
          --dart-define=PRIVACY_POLICY_URL="$PRIVACY_POLICY_URL"
          --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL"
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: world-dominion-1.4.0-realism-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
